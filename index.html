    <title>FeedSolve</title>
    <script>
      // Resolve the theme before first paint so the app never flashes light
      // while React boots. Mirrors the logic in src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('feedsolve_theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : null;
          var resolved =
            mode ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', resolved === 'dark' ? '#201e1c' : '#f5f0ec');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
